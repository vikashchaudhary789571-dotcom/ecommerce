services:
  - type: web
    name: pdf-editor
    env: node
    region: oregon
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: UPLOAD_LIMIT
        value: 50mb
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
